<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشاريع الطلاب - وضع التصحيح</title>
    <style>
        :root { --primary: #10b981; --secondary: #059669; --bg: #f3f4f6; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #1f2937; }
        .container { max-width: 900px; margin: 0 auto; }
        .form-section { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        #status-msg { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 8px; }
        .error-details { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; display: none; }
        .project-card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border-right: 6px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center;">
        <h1>🚀 منصة مشاريع الطلاب</h1>
        <p>وضع اكتشاف الأخطاء وتصحيحها</p>
    </header>

    <div class="form-section">
        <h3>تقديم فكرة جديدة</h3>
        <form id="projectForm">
            <div class="form-group">
                <label>اسم الطالب</label>
                <input type="text" id="studentName" required>
            </div>
            <div class="form-group">
                <label>عنوان الفكرة</label>
                <input type="text" id="projectTitle" required>
            </div>
            <div class="form-group">
                <label>شرح الفكرة</label>
                <textarea id="projectDesc" rows="4" required></textarea>
            </div>
            <button type="submit" id="submitBtn">إرسال الفكرة</button>
            <div id="status-msg"></div>
        </form>
    </div>

    <div id="projectsList"></div>
</div>

<script>
    const BASE_ID = 'appGRPTNdapbfHFVj'; 
    const TABLE_ID = 'tblbntjxitx37Xmet'; 
    const PAT = 'patzRHjvmJlAoNz4w.1419f7b883c2e1222e48776065cbef112ef4448658666f6c83959d448a75c664'; 

    const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`;
    const headers = { 'Authorization': `Bearer ${PAT}`, 'Content-Type': 'application/json' };

    async function fetchProjects() {
        const listDiv = document.getElementById('projectsList');
        try {
            const response = await fetch(`${url}?sort[0][field]=تاريخ التسجيل&sort[0][direction]=desc`, { headers });
            const data = await response.json();
            listDiv.innerHTML = '<h2>📚 المشاريع الحالية</h2>';
            if (data.records) {
                data.records.forEach(record => {
                    const f = record.fields;
                    listDiv.innerHTML += `<div class="project-card"><h3>${f['عنوان الفكرة'] || 'بدون عنوان'}</h3><p><strong>الطالب:</strong> ${f['اسم الطالب']}</p></div>`;
                });
            }
        } catch (e) { console.error("Fetch error:", e); }
    }

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-msg');
        
        btn.disabled = true;
        statusMsg.style.display = 'block';
        statusMsg.className = '';
        statusMsg.innerText = '⏳ جاري المحاولة...';

        const bodyData = {
            records: [{
                fields: {
                    "اسم الطالب": document.getElementById('studentName').value,
                    "عنوان الفكرة": document.getElementById('projectTitle').value,
                    "شرح الفكرة": document.getElementById('projectDesc').value
                }
            }]
        };

        try {
            const response = await fetch(url, { method: 'POST', headers, body: JSON.stringify(bodyData) });
            const result = await response.json();

            if (response.ok) {
                statusMsg.style.color = 'green';
                statusMsg.innerText = '✅ نجحت العملية! تم الحفظ.';
                document.getElementById('projectForm').reset();
                fetchProjects();
            } else {
                // هنا الجزء المهم: كشف سبب الخطأ بالتفصيل
                console.error("Airtable Error Response:", result);
                statusMsg.className = 'error-details';
                statusMsg.style.display = 'block';
                statusMsg.innerHTML = `
                    ❌ فشل الإرسال بسبب:<br>
                    <strong>نوع الخطأ:</strong> ${result.error.type}<br>
                    <strong>الرسالة:</strong> ${result.error.message}
                `;
            }
        } catch (error) {
            statusMsg.innerText = '❌ خطأ في الشبكة أو اتصال الـ API.';
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    });

    fetchProjects();
</script>
</body>
</html>
